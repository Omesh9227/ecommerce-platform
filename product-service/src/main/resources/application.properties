# =====================================================================
# product-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=product-service

# Reads the root .env. Two paths so it works whether the working directory is
# product-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8082
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_product_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PRODUCT_SERVICE_DB_NAME:ecommerce_product_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=product-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# JPA / Hibernate - Flyway owns the schema; Hibernate only validates it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Loads lazy associations (category, image URLs) in batches instead of one query per product
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------------
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Catalog
# ---------------------------------------------------------------------
app.catalog.currency=INR

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8082/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.productservice=DEBUG
