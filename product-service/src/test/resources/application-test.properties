# =====================================================================
# Test profile - active only for tests (@ActiveProfiles("test")). Overrides application.properties.
# Integration tests use a separate database so dev data is never touched.
# Create it once:  CREATE DATABASE ecommerce_product_test_db;
# The DB password comes from the root .env (or the POSTGRES_PASSWORD env var).
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_product_test_db

# Test-only JWT key (same test key user-service and api-gateway use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.productservice=INFO

# Relay outbox events quickly so tests don't wait long
app.outbox.poll-interval-ms=200
app.kafka.topics.partitions=1
