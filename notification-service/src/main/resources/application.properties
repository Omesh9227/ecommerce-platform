# =====================================================================
# notification-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=notification-service

# Reads the root .env. Two paths so it works whether the working directory is
# notification-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

server.port=8087
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_notification_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATION_SERVICE_DB_NAME:ecommerce_notification_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=notification-service-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Email (SMTP). Locally: Mailpit (brew install mailpit) - inbox at http://localhost:8025
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# A real provider (e.g. Amazon SES, SendGrid) needs: spring.mail.username / password and
# spring.mail.properties.mail.smtp.auth=true, spring.mail.properties.mail.smtp.starttls.enable=true


# ---------------------------------------------------------------------
# Sender, store name, support address: in config-repo/notification-service.properties (served by config-server)
# app.notification.*
# ---------------------------------------------------------------------

# Thymeleaf is only used for email templates (no web pages)
spring.thymeleaf.check-template-location=false

# ---------------------------------------------------------------------
# Kafka - consumes order-events and payment-events
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topics.order-events=order-events
app.kafka.topics.payment-events=payment-events
app.kafka.topics.wishlist-events=wishlist-events
app.kafka.topics.partitions=3

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Health includes the mail server: DOWN here means Mailpit (or your SMTP server) isn't reachable
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.ecommerce.notificationservice=DEBUG
logging.level.org.apache.kafka=WARN

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties and config-repo/notification-service.properties
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
