# =====================================================================
# recommendation-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=recommendation-service

# Reads the root .env. Two paths so it works whether the working directory is
# recommendation-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8092
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_recommendation_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${RECOMMENDATION_SERVICE_DB_NAME:ecommerce_recommendation_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=recommendation-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# Flyway owns the schema
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Kafka - only consumes: product-events and category-events (product-service), inventory-events (stock),
# review-events (ratings), order-events (paid and cancelled orders). Nothing is published.
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=recommendation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topics.product-events=product-events
app.kafka.topics.category-events=category-events
app.kafka.topics.inventory-events=inventory-events
app.kafka.topics.review-events=review-events
app.kafka.topics.order-events=order-events
app.kafka.topics.partitions=3

# ---------------------------------------------------------------------
# Recommendation settings: in config-repo/recommendation-service.properties (served by config-server)
# app.recommendation.trending-days, app.recommendation.max-limit, app.recommendation.view-history, ...
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8092/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.recommendationservice=DEBUG
logging.level.org.apache.kafka=WARN

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties and config-repo/recommendation-service.properties
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
