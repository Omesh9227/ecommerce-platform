# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_recommendation_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); catalog and order events are sent to it by the tests.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_recommendation_test_db
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.recommendationservice=INFO

app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Recommendation settings (at runtime they come from config-repo/recommendation-service.properties)
app.recommendation.currency=INR
app.recommendation.default-limit=8
app.recommendation.max-limit=20
app.recommendation.trending-days=7
app.recommendation.view-history=20
