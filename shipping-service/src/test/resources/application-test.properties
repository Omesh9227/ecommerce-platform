# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_shipping_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); order events are sent to it by the tests.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_shipping_test_db
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.shippingservice=INFO

app.outbox.poll-interval-ms=200
app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/shipping-service.properties)
app.shipping.origin-postal-code=560001
app.shipping.time-zone=Asia/Kolkata
app.shipping.delivery-days.same-city=1
app.shipping.delivery-days.same-region=2
app.shipping.delivery-days.same-zone=3
app.shipping.delivery-days.other=5
app.shipping.carriers=Delhivery,Blue Dart,Ecom Express,India Post
