# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_admin_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); order, payment, stock and shipment events are sent to it by the tests.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_admin_test_db
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.adminservice=INFO

app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Dashboard settings (at runtime they come from config-repo/admin-service.properties)
app.dashboard.currency=INR
app.dashboard.time-zone=Asia/Kolkata
app.dashboard.max-range-days=366
app.dashboard.activity-days=90
