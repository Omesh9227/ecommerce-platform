# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_review_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); product-service and user-service
# are replaced by a stub server - neither needs to be running.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_review_test_db
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.reviewservice=INFO

app.outbox.poll-interval-ms=200
app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/review-service.properties)
app.review.verified-purchase-required=false
services.read-timeout=2s
