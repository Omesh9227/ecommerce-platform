# admin-service settings (served by config-server)

app.dashboard.currency=${shop.currency}

# Days in reports run midnight to midnight in this time zone (where the shop is)
app.dashboard.time-zone=Asia/Kolkata

# The longest period one report may cover (from / to), and how long activity-feed lines are kept
app.dashboard.max-range-days=366
app.dashboard.activity-days=90
