# =====================================================================
# config-repo/application.properties - given to EVERY service by config-server
#
# Per-service settings are in <spring.application.name>.properties next to this file; they win over
# this one. A service's own src/main/resources/application.properties has the technical settings
# (ports, database, Kafka...); this folder has the settings you change without rebuilding.
# Change a value, then restart the service (no rebuild).
#
# Never put a secret here (this folder is in Git): use ${PLACEHOLDERS}. Each service fills them in from
# its own environment / the root .env. config-server's ConfigRepoFilesTest fails the build otherwise.
# =====================================================================

# ---------------------------------------------------------------------
# Store-wide values, used by several services
# ---------------------------------------------------------------------
shop.currency=INR
# How long a customer has to pay for an order: order-service cancels it after this,
# notification-service tells the customer the same number in the "order placed" email
shop.payment-window-minutes=30

# ---------------------------------------------------------------------
# Eureka (discovery-server): where each service registers and how it's listed
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
# Registered as localhost:<port> (Docker will set EUREKA_INSTANCE_HOSTNAME to the container name)
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Quicker than the defaults (30 s): a started or stopped service is noticed within seconds
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=10
# How long callers (gateway, cart, order) remember the list of instances
spring.cloud.loadbalancer.cache.ttl=10s
