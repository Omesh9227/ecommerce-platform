# recommendation-service settings (served by config-server)

app.recommendation.currency=${shop.currency}

# Products per list when the request doesn't say (?limit=), and the most a request may ask for
app.recommendation.default-limit=8
app.recommendation.max-limit=20

# "Trending" counts units sold in the last N days
app.recommendation.trending-days=7

# How many of a customer's latest views feed "recently viewed", "also viewed" and "for you"
app.recommendation.view-history=20
