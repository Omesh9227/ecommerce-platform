# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_search_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); catalog events are sent to it by the tests.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_search_test_db
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.searchservice=INFO

app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Search settings (at runtime they come from config-repo/search-service.properties)
app.search.currency=INR
app.search.price-ranges=500,1000,5000,20000
app.search.max-page-size=50
app.search.suggestion-limit=8
app.search.popular-days=30
app.search.facet-limit=20
