<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${content.subject()}">Subject</title>
</head>
<!-- Email clients ignore <style> blocks and external CSS, so every style is inline and the layout uses tables. -->
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;">
                <tr>
                    <td style="background-color:#18181b;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:bold;border-radius:8px 8px 0 0;"
                        th:text="${storeName}">Store</td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <h1 style="font-size:20px;margin:0 0 12px 0;" th:text="${content.heading()}">Heading</h1>
                        <p style="font-size:14px;line-height:1.5;margin:0 0 16px 0;" th:text="${content.intro()}">Intro</p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               th:if="${!content.details().isEmpty()}" style="font-size:14px;margin:0 0 16px 0;">
                            <tr th:each="detail : ${content.details()}">
                                <td style="padding:4px 0;color:#71717a;width:40%;" th:text="${detail.label()}">Label</td>
                                <td style="padding:4px 0;font-weight:bold;" th:text="${detail.value()}">Value</td>
                            </tr>
                        </table>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               th:if="${!content.items().isEmpty()}"
                               style="font-size:14px;border-top:1px solid #e4e4e7;margin:0 0 16px 0;">
                            <tr th:each="item : ${content.items()}">
                                <td style="padding:8px 0;border-bottom:1px solid #e4e4e7;" th:text="${item.name()}">Item</td>
                                <td style="padding:8px 0;border-bottom:1px solid #e4e4e7;text-align:center;width:60px;"
                                    th:text="${'x ' + item.quantity()}">x 1</td>
                                <td style="padding:8px 0;border-bottom:1px solid #e4e4e7;text-align:right;width:140px;"
                                    th:text="${item.lineTotal()}">0.00</td>
                            </tr>
                            <tr th:if="${content.total() != null}">
                                <td colspan="2" style="padding:8px 0;font-weight:bold;">Total</td>
                                <td style="padding:8px 0;font-weight:bold;text-align:right;" th:text="${content.total()}">0.00</td>
                            </tr>
                        </table>

                        <p th:if="${content.outro() != null}" style="font-size:14px;line-height:1.5;margin:0;"
                           th:text="${content.outro()}">Outro</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 24px;font-size:12px;color:#71717a;border-top:1px solid #e4e4e7;">
                        Questions? Write to <span th:text="${supportEmail}">support@example.com</span>.
                        This is an automated message - please don't reply.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
