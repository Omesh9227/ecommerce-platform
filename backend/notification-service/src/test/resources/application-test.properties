# =====================================================================
# Test profile. Integration tests use a separate database:
#   CREATE DATABASE ecommerce_notification_test_db;
# Kafka is an in-memory broker (@EmbeddedKafka); emails are captured by a recording mail sender
# (no Mailpit needed).
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_notification_test_db

security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

app.kafka.topics.partitions=1
management.health.mail.enabled=false
logging.level.com.ecommerce.notificationservice=INFO

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/notification-service.properties)
app.notification.from-address=no-reply@ecommerce.local
app.notification.from-name=E-Commerce Store
app.notification.store-name=E-Commerce Store
app.notification.support-email=support@ecommerce.local
app.notification.payment-window-minutes=30
