# =====================================================================
# config-server - Spring Cloud Config Server (committed to Git)
#
# Serves the files in config-repo/ (repository root):
#   application.properties          -> every service
#   <spring.application.name>.properties -> that service only (wins over application.properties)
# Check what a service gets:  curl -u config:<CONFIG_SERVER_PASSWORD> http://localhost:8888/order-service/default
# Credentials come from the root .env: CONFIG_SERVER_USERNAME, CONFIG_SERVER_PASSWORD.
# =====================================================================

spring.application.name=config-server

# Reads the root .env (the repository root, next to backend/ and frontend/) as KEY=VALUE pairs.
# "optional:" = no failure if absent (in Docker the values arrive as real environment variables).
# Three paths so it works whether the working directory is backend/config-server/ (IntelliJ, mvn),
# backend/ or the repository root.
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8888

# ---------------------------------------------------------------------
# Where the configuration lives: the config-repo/ folder of this Git repository ("native" = files).
# Relative to the working directory (backend/config-server/ in IntelliJ and mvn), so ../config-repo is
# backend/config-repo. In Docker it will be a mounted
# folder (CONFIG_REPO_LOCATION=file:/config-repo/). A separate Git repo works too
# (profile "git" + spring.cloud.config.server.git.uri) - nothing changes for the services.
# ---------------------------------------------------------------------
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_LOCATION:file:../config-repo/}

# Login the services use
spring.security.user.name=${CONFIG_SERVER_USERNAME:config}
spring.security.user.password=${CONFIG_SERVER_PASSWORD}

# ---------------------------------------------------------------------
# Registers in Eureka so the dashboard shows the whole platform
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.netflix.discovery=WARN
