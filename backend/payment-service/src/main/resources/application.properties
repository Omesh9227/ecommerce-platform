# =====================================================================
# payment-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=payment-service

# Reads the root .env (the repository root, next to backend/ and frontend/) as KEY=VALUE pairs.
# "optional:" = no failure if absent (in Docker the values arrive as real environment variables).
# Three paths so it works whether the working directory is backend/payment-service/ (IntelliJ, mvn),
# backend/ or the repository root.
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8086
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_payment_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYMENT_SERVICE_DB_NAME:ecommerce_payment_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=payment-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# JPA / Hibernate - Flyway owns the schema; Hibernate only validates it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Kafka - consumes order-events, publishes payment-events
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topics.order-events=order-events
app.kafka.topics.payment-events=payment-events
app.kafka.topics.partitions=3

app.outbox.poll-interval-ms=1000
app.outbox.batch-size=50
app.outbox.send-timeout-seconds=10

# ---------------------------------------------------------------------
# Payment provider: in config-repo/payment-service.properties (served by config-server)
# app.payment.gateway
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8086/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging (request bodies are never logged: they can contain card data)
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.paymentservice=DEBUG
logging.level.org.apache.kafka=WARN

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties and config-repo/payment-service.properties
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
