# =====================================================================
# discovery-server - Eureka service registry (committed to Git)
#
# Every service registers here when it starts; the gateway, cart-service and order-service
# find each other here (lb://order-service) instead of using fixed host:port URLs.
# Credentials come from the root .env: EUREKA_USERNAME, EUREKA_PASSWORD.
# =====================================================================

spring.application.name=discovery-server

# Reads the root .env (the repository root, next to backend/ and frontend/) as KEY=VALUE pairs.
# "optional:" = no failure if absent (in Docker the values arrive as real environment variables).
# Three paths so it works whether the working directory is backend/discovery-server/ (IntelliJ, mvn),
# backend/ or the repository root.
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8761

# Dashboard and registry login
spring.security.user.name=${EUREKA_USERNAME:eureka}
spring.security.user.password=${EUREKA_PASSWORD}

# ---------------------------------------------------------------------
# Standalone registry (one instance): it doesn't register with itself or copy from peers
# ---------------------------------------------------------------------
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.wait-time-in-ms-when-sync-empty=0

# Local development: a stopped service disappears from the registry within ~30 s.
# Self-preservation (on in production with several registries) would keep stale entries during
# network trouble; on one laptop it only keeps services that were really stopped.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
