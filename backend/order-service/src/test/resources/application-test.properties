# =====================================================================
# Test profile - active only for tests (@ActiveProfiles("test")). Overrides application.properties.
# Integration tests use a separate database so dev data is never touched.
# Create it once:  CREATE DATABASE ecommerce_order_test_db;
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka); cart-, product- and inventory-service
# are replaced by a stub server - none of them needs to be running.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_order_test_db
# The concurrency test runs several checkouts at once
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.orderservice=INFO

app.outbox.poll-interval-ms=200
app.kafka.topics.partitions=1
# Tests run the expiry job themselves (with a controllable clock)
app.order.expiry-check-interval-ms=3600000
services.read-timeout=2s

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/order-service.properties)
app.order.currency=INR
app.order.shipping-fee=40.00
app.order.free-shipping-threshold=499.00
app.order.payment-window=30m
app.order.stuck-checkout-timeout=2m
