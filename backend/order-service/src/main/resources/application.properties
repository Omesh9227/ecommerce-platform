# =====================================================================
# order-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=order-service

# Reads the root .env (the repository root, next to backend/ and frontend/) as KEY=VALUE pairs.
# "optional:" = no failure if absent (in Docker the values arrive as real environment variables).
# Three paths so it works whether the working directory is backend/order-service/ (IntelliJ, mvn),
# backend/ or the repository root.
spring.config.import=optional:file:../../.env[.properties],optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8085
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_order_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_SERVICE_DB_NAME:ecommerce_order_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=order-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# JPA / Hibernate - Flyway owns the schema; Hibernate only validates it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------------
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Kafka - publishes order-events, consumes payment-events and shipment-events (shipping-service)
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.topics.order-events=order-events
app.kafka.topics.payment-events=payment-events
app.kafka.topics.shipment-events=shipment-events
app.kafka.topics.partitions=3

# ---------------------------------------------------------------------
# Transactional outbox (events are saved with the order, then relayed to Kafka)
# ---------------------------------------------------------------------
app.outbox.poll-interval-ms=1000
app.outbox.batch-size=50
app.outbox.send-timeout-seconds=10

# ---------------------------------------------------------------------
# Order rules: in config-repo/order-service.properties (served by config-server)
# app.order.* - shipping fee, free-shipping threshold, payment window, expiry
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# Services this one calls directly (not through the gateway). lb://<name> = found through Eureka;
# a fixed http://host:port also works (tests point them at a stub server).
# ---------------------------------------------------------------------
services.cart-service.url=${CART_SERVICE_URL:lb://cart-service}
services.product-service.url=${PRODUCT_SERVICE_URL:lb://product-service}
services.inventory-service.url=${INVENTORY_SERVICE_URL:lb://inventory-service}
services.connect-timeout=2s
services.read-timeout=5s

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens).
# The same key signs order-service's own short-lived service token for inventory-service.
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8085/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.orderservice=DEBUG
logging.level.org.apache.kafka=WARN

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties and config-repo/order-service.properties
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
