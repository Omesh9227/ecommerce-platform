# =====================================================================
# Test profile - active only for tests (@ActiveProfiles("test")). Overrides application.properties.
# Integration tests use a separate database so dev data is never touched.
# Create it once:  CREATE DATABASE ecommerce_user_test_db;
# The DB password still comes from the root .env (or the POSTGRES_PASSWORD env var).
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_user_test_db

# Test-only JWT key, deliberately different from the real one
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.expiration-seconds=3600
security.jwt.issuer=ecommerce-user-service

# Low BCrypt cost keeps the test suite fast; production uses 12
security.password.bcrypt-strength=4

# Tests create their own admin; don't bootstrap one
app.bootstrap-admin.email=
app.bootstrap-admin.password=

logging.level.com.ecommerce.userservice=INFO
