# =====================================================================
# user-service - base configuration (committed to Git)
#
# Secrets are NOT stored here. Placeholders such as ${POSTGRES_PASSWORD} are resolved from:
#   1. Environment variables (highest priority - used later in Docker/Kubernetes)
#   2. The .env file at the repository root (git-ignored, shared by all services)
# =====================================================================

spring.application.name=user-service

# Reads the root .env as KEY=VALUE pairs. "optional:" = no failure if absent (in Docker, values arrive
# as real environment variables instead). Two paths so it works whether the working directory is
# user-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8081
# Never leak internals in error responses; GlobalExceptionHandler shapes all errors
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL)
# ---------------------------------------------------------------------
# DB_HOST becomes "postgres" (the container name) in Docker; each service owns its own database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${USER_SERVICE_DB_NAME:ecommerce_user_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=user-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema; Hibernate only checks that entities match it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Flyway (database migrations in src/main/resources/db/migration)
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------------
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Security - JWT
# Secret must be a Base64-encoded key of at least 256 bits
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.issuer=ecommerce-user-service
security.password.bcrypt-strength=12

# ---------------------------------------------------------------------
# CORS (comma-separated list of allowed frontend origins)
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------
# First ADMIN account - created on startup only if email + password are set
# and no account with that email exists yet
# ---------------------------------------------------------------------
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${ADMIN_FIRST_NAME:System}
app.bootstrap-admin.last-name=${ADMIN_LAST_NAME:Admin}
app.bootstrap-admin.phone-number=${ADMIN_PHONE:9999999999}

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8081/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.userservice=DEBUG

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties (and config-repo/user-service.properties,
#   if one is added)
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
