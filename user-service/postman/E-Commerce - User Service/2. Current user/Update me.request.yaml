$kind: http-request
url: "{{baseUrl}}/api/v1/users/me"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
body:
  type: json
  content: |-
    {
      "firstName": "Omesh",
      "lastName": "Sharma",
      "phoneNumber": "9123456780"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
