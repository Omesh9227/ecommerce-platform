$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "Wrong@1234"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 5000
