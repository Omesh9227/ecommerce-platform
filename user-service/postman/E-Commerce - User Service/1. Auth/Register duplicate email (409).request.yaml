$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Omesh",
      "lastName": "Kumar",
      "email": "{{customerEmail}}",
      "phoneNumber": "9876543210",
      "password": "{{customerPassword}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
