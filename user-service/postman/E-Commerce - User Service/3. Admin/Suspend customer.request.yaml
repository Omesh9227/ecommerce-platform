$kind: http-request
url: "{{baseUrl}}/api/v1/admin/users/{{customerId}}/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: json
  content: |-
    {
      "status": "SUSPENDED"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
