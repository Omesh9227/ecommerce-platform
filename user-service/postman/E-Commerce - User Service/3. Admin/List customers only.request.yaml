$kind: http-request
url: "{{baseUrl}}/api/v1/admin/users?role=CUSTOMER"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  role: CUSTOMER
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
