$kind: http-request
url: "{{baseUrl}}/api/v1/admin/users?page=0&size=20&sort=createdAt,desc"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  page: "0"
  size: "20"
  sort: createdAt,desc
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
