# =====================================================================
# Test profile - active only for tests (@ActiveProfiles("test")). Overrides application.properties.
# Integration tests use a separate database so dev data is never touched.
# Create it once:  CREATE DATABASE ecommerce_inventory_test_db;
# The DB password comes from the root .env (or the POSTGRES_PASSWORD env var).
# Kafka is an in-memory broker started by the tests (@EmbeddedKafka) - no local Kafka needed.
# =====================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ecommerce_inventory_test_db
# The concurrency tests run many transactions at once
spring.datasource.hikari.maximum-pool-size=20

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

logging.level.com.ecommerce.inventoryservice=INFO

# Relay outbox events quickly so tests don't wait long
app.outbox.poll-interval-ms=200
app.kafka.topics.partitions=1

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/inventory-service.properties)
app.inventory.default-low-stock-threshold=5
