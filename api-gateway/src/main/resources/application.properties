# =====================================================================
# api-gateway - base configuration (committed to Git)
#
# Single entry point for all clients (port 8080). Secrets are NOT stored here:
# ${JWT_SECRET} etc. come from environment variables or the root .env file.
# =====================================================================

spring.application.name=api-gateway

# Reads the root .env (shared with user-service). Two paths so it works whether the working
# directory is api-gateway/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8080
# Unknown paths return a JSON 404 instead of trying to serve static files
spring.web.resources.add-mappings=false

# ---------------------------------------------------------------------
# Downstream services. lb://<name> = look the service up in Eureka (discovery-server) and spread requests
# over its running instances. A fixed http://host:port also works (tests use one for their stub server).
# ---------------------------------------------------------------------
services.user-service.url=${USER_SERVICE_URL:lb://user-service}
services.product-service.url=${PRODUCT_SERVICE_URL:lb://product-service}
services.inventory-service.url=${INVENTORY_SERVICE_URL:lb://inventory-service}
services.cart-service.url=${CART_SERVICE_URL:lb://cart-service}
services.order-service.url=${ORDER_SERVICE_URL:lb://order-service}
services.payment-service.url=${PAYMENT_SERVICE_URL:lb://payment-service}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:lb://notification-service}
services.wishlist-service.url=${WISHLIST_SERVICE_URL:lb://wishlist-service}
services.review-service.url=${REVIEW_SERVICE_URL:lb://review-service}
services.shipping-service.url=${SHIPPING_SERVICE_URL:lb://shipping-service}

# ---------------------------------------------------------------------
# Upstream HTTP client timeouts
# ---------------------------------------------------------------------
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# ---------------------------------------------------------------------
# Security - JWT (must match user-service: same secret, same issuer)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# Paths that need no token for any method (Ant-style patterns, comma-separated)
gateway.security.public-paths=/api/v1/auth/register,/api/v1/auth/login
# Paths that need no token for GET/HEAD - anyone can browse the catalog
gateway.security.public-get-paths=/api/v1/products/**,/api/v1/categories/**,/api/v1/reviews/products/**,/api/v1/shipments/track/**,/api/v1/shipments/delivery-estimate
# Paths that need the ADMIN role for every method
gateway.security.admin-paths=/api/v1/admin/**,/api/v1/inventory/**,/api/v1/orders/admin/**,/api/v1/payments/admin/**,/api/v1/notifications/admin/**,/api/v1/reviews/admin/**,/api/v1/shipments/admin/**
# Paths that need the ADMIN role for anything except GET/HEAD - only admins change the catalog
gateway.security.admin-write-paths=/api/v1/products/**,/api/v1/categories/**

# ---------------------------------------------------------------------
# CORS - handled here for every service (comma-separated origins)
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------
# Actuator - /actuator/health and /actuator/gateway/routes (lists configured routes)
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.apigateway=DEBUG

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties (and config-repo/api-gateway.properties,
#   if one is added)
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
