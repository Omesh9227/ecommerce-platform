# =====================================================================
# api-gateway - base configuration (committed to Git)
#
# Single entry point for all clients (port 8080). Secrets are NOT stored here:
# ${JWT_SECRET} etc. come from environment variables or the root .env file.
# =====================================================================

spring.application.name=api-gateway

# Reads the root .env (shared with user-service). Two paths so it works whether the working
# directory is api-gateway/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8080
# Unknown paths return a JSON 404 instead of trying to serve static files
spring.web.resources.add-mappings=false

# ---------------------------------------------------------------------
# Downstream services (become lb://<service-name> once Eureka is added)
# ---------------------------------------------------------------------
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# ---------------------------------------------------------------------
# Upstream HTTP client timeouts
# ---------------------------------------------------------------------
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# ---------------------------------------------------------------------
# Security - JWT (must match user-service: same secret, same issuer)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# Paths that need no token for any method (Ant-style patterns, comma-separated)
gateway.security.public-paths=/api/v1/auth/register,/api/v1/auth/login
# Paths that need no token for GET/HEAD - anyone can browse the catalog
gateway.security.public-get-paths=/api/v1/products/**,/api/v1/categories/**
# Paths that need the ADMIN role for every method
gateway.security.admin-paths=/api/v1/admin/**
# Paths that need the ADMIN role for anything except GET/HEAD - only admins change the catalog
gateway.security.admin-write-paths=/api/v1/products/**,/api/v1/categories/**

# ---------------------------------------------------------------------
# CORS - handled here for every service (comma-separated origins)
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------
# Actuator - /actuator/health and /actuator/gateway/routes (lists configured routes)
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.apigateway=DEBUG
