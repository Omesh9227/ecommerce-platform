# =====================================================================
# order-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${POSTGRES_PASSWORD}, ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=order-service

# Reads the root .env. Two paths so it works whether the working directory is
# order-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8085
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Database (PostgreSQL) - this service owns ecommerce_order_db
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_SERVICE_DB_NAME:ecommerce_order_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.pool-name=order-service-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------------------------------------------------------------------
# JPA / Hibernate - Flyway owns the schema; Hibernate only validates it
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------------
spring.data.web.pageable.max-page-size=100

# ---------------------------------------------------------------------
# Kafka - order-service only publishes (order-events)
# ---------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

app.kafka.topics.order-events=order-events
app.kafka.topics.partitions=3

# ---------------------------------------------------------------------
# Transactional outbox (events are saved with the order, then relayed to Kafka)
# ---------------------------------------------------------------------
app.outbox.poll-interval-ms=1000
app.outbox.batch-size=50
app.outbox.send-timeout-seconds=10

# ---------------------------------------------------------------------
# Orders
# ---------------------------------------------------------------------
app.order.currency=INR
app.order.shipping-fee=40.00
app.order.free-shipping-threshold=499.00
# Unpaid orders are cancelled (and their stock released) after this long
app.order.payment-window=30m
# A checkout that never finished (service stopped mid-way) is cleaned up after this long
app.order.stuck-checkout-timeout=2m
app.order.expiry-check-interval-ms=30000

# ---------------------------------------------------------------------
# Services this one calls directly (not through the gateway)
# ---------------------------------------------------------------------
services.cart-service.url=${CART_SERVICE_URL:http://localhost:8084}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8083}
services.connect-timeout=2s
services.read-timeout=5s

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens).
# The same key signs order-service's own short-lived service token for inventory-service.
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8085/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.orderservice=DEBUG
logging.level.org.apache.kafka=WARN
