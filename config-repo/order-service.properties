# order-service settings (served by config-server)

app.order.currency=${shop.currency}
app.order.shipping-fee=40.00
app.order.free-shipping-threshold=499.00
# Unpaid orders are cancelled (and their stock released) after this long
app.order.payment-window=${shop.payment-window-minutes}m
# A checkout that never finished (service stopped mid-way) is cleaned up after this long
app.order.stuck-checkout-timeout=2m
app.order.expiry-check-interval-ms=30000
