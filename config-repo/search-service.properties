# search-service settings (served by config-server)

app.search.currency=${shop.currency}

# The price filter's buckets: under 500 / 500 - 1,000 / 1,000 - 5,000 / 5,000 - 20,000 / 20,000 and above
app.search.price-ranges=500,1000,5000,20000

# Largest page a search may ask for, products shown in search-box suggestions, brands/categories listed in filters
app.search.max-page-size=50
app.search.suggestion-limit=8
app.search.facet-limit=20

# "Popular searches" counts searches (that found something) made in the last N days
app.search.popular-days=30
