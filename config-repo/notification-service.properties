# notification-service settings (served by config-server)

# Who the emails come from and what they say
app.notification.from-address=no-reply@ecommerce.local
app.notification.from-name=E-Commerce Store
app.notification.store-name=E-Commerce Store
app.notification.support-email=support@ecommerce.local
# Must match order-service: both come from shop.payment-window-minutes in application.properties
app.notification.payment-window-minutes=${shop.payment-window-minutes}
