# wishlist-service settings (served by config-server)

# How many products one customer can save
app.wishlist.max-items=100
# A price-drop email is sent only when the price fell at least this much (in %) below the price the customer last
# saw - when they saved it, or in the previous price-drop email. So small changes don't send emails.
app.wishlist.price-drop-min-percent=5
app.wishlist.currency=${shop.currency}
