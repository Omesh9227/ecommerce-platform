# shipping-service settings (served by config-server)

# The warehouse every parcel leaves from: delivery times are counted from its PIN code, and "today" is its date.
app.shipping.origin-postal-code=560001
app.shipping.time-zone=Asia/Kolkata

# Days to deliver, by how many leading PIN-code digits the destination shares with the warehouse:
# 3 digits (same sorting district, ~ same city), 2 (same postal region), 1 (same zone), none.
app.shipping.delivery-days.same-city=1
app.shipping.delivery-days.same-region=2
app.shipping.delivery-days.same-zone=3
app.shipping.delivery-days.other=5

# Carriers we hand parcels to (a shipment's carrier must be one of these; matched ignoring case)
app.shipping.carriers=Delhivery,Blue Dart,Ecom Express,India Post
