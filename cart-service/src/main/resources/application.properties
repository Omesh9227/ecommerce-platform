# =====================================================================
# cart-service - base configuration (committed to Git)
#
# Secrets are NOT stored here: ${JWT_SECRET} etc. come from
# environment variables or the root .env file (shared by all services).
# =====================================================================

spring.application.name=cart-service

# Reads the root .env. Two paths so it works whether the working directory is
# cart-service/ (IntelliJ, mvn) or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Config Server (config-server, port 8888) supplies the shared settings and this service's business
# settings from config-repo/ (see the end of this file). Start discovery-server and config-server first:
# if config-server can't be reached, this service stops at startup with a clear error.
spring.cloud.config.uri=${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8084
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------
# Redis - carts are stored here (no PostgreSQL database for this service)
# ---------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${CART_REDIS_DATABASE:0}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# If your Redis needs a password, add REDIS_PASSWORD to .env and uncomment:
# spring.data.redis.password=${REDIS_PASSWORD}

# ---------------------------------------------------------------------
# Cart rules: in config-repo/cart-service.properties (served by config-server)
# app.cart.max-items, max-quantity-per-item, ttl, currency
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# product-service (live prices and stock). lb://product-service = found through Eureka;
# a fixed http://host:port also works (tests point it at a stub server).
# ---------------------------------------------------------------------
services.product-service.url=${PRODUCT_SERVICE_URL:lb://product-service}
services.product-service.connect-timeout=2s
services.product-service.read-timeout=3s

# ---------------------------------------------------------------------
# Security - JWT validation (same secret and issuer as user-service, which issues the tokens)
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=ecommerce-user-service

# ---------------------------------------------------------------------
# Swagger / OpenAPI  ->  http://localhost:8084/swagger-ui.html
# ---------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------------------------------------------------
# Actuator (health includes Redis)
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.ecommerce.cartservice=DEBUG

#---
spring.config.activate.on-profile=!test
spring.config.import=configserver:
# ^ Everywhere except tests: load config-repo/application.properties and config-repo/cart-service.properties
#   from the Config Server (they win over this file). Tests use application-test.properties instead and
#   never call the Config Server or Eureka. ("#---" starts a second document; keep the property line
#   directly after it - Spring Boot ignores a separator that is followed by a comment.)
