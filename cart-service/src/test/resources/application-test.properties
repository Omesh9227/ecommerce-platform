# =====================================================================
# Test profile - active only for tests (@ActiveProfiles("test")). Overrides application.properties.
# Integration tests need a local Redis (brew services start redis) and use database 15,
# which they empty before every test - carts in database 0 (dev) are never touched.
# product-service is replaced by a small stub server started by the tests.
# =====================================================================

spring.data.redis.database=15

# Test-only JWT key (same test key the other services use in their tests). Never use outside tests.
security.jwt.secret=8JcdjF4BaCg1d9tJm+ONJ0g+J1cVkGcNWqfnfT5bRkD1eMTyx6g4jH5gqi0C7f/L
security.jwt.issuer=ecommerce-user-service

services.product-service.read-timeout=2s

logging.level.com.ecommerce.cartservice=INFO

# ---------------------------------------------------------------------
# Tests never use the Config Server or Eureka, even when they're running on this machine
# ---------------------------------------------------------------------
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Business settings (at runtime they come from config-repo/cart-service.properties)
app.cart.max-items=50
app.cart.max-quantity-per-item=10
app.cart.ttl=30d
app.cart.currency=INR
